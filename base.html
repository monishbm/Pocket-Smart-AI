<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}PocketSmart AI{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}"></head>
<body><header class="site-header"><div class="container nav"><a class="brand" href="/">PocketSmart <span>AI</span></a><nav>
{% if user %}<a href="/dashboard">Dashboard</a><a href="/history">History</a><form action="/logout" method="post" class="inline-form"><button class="link-button">Logout</button></form>
{% else %}<a href="/login">Login</a><a class="button small" href="/register">Register</a>{% endif %}</nav></div></header>
<main class="container main">{% block content %}{% endblock %}</main>
<footer class="footer"><div class="container">PocketSmart AI · Recommendations and prices are estimates; verify live prices before purchasing.</div></footer></body></html>
